                    # This tells the CMS to use test-repo backend for development (no authentication required)
                    backend:
                      name: test-repo

                    # This tells the CMS where to save any images you upload.
                    media_folder: "client/public/uploads"
                    public_folder: "/uploads"

                    # This is where we define the content you can edit.
                    # We will start by adding your French translation file here.
                    collections:
                      - name: "translations" # An internal name for this content type
                        label: "Website Content (French)" # The name you will see in the CMS
                        files:
                          - label: "French Translations"
                            name: "fr_translations"
                            file: "client/public/locales/fr/translation.json" # The exact path to your file
                            fields:
                              # We need to add fields that match your JSON file structure.
                              # For now, let's just add one simple field as a test.
                              - { label: "Test Field", name: "test_field", widget: "string" }
                      # Blog articles. Each article is saved as one JSON file in
                      # client/src/content/blog/ and listed on the /blog page.
                      - name: "blog"
                        label: "Blog"
                        label_singular: "Article"
                        folder: "client/src/content/blog"
                        create: true
                        extension: "json"
                        format: "json"
                        slug: "{{slug}}"
                        summary: "{{title}} ({{language}})"
                        sortable_fields: ["date", "title"]
                        fields:
                          - { label: "Title", name: "title", widget: "string" }
                          - { label: "Slug (URL)", name: "slug", widget: "string", required: false, hint: "Leave empty to use the file name" }
                          - { label: "Language", name: "language", widget: "select", options: ["en", "fr"], default: "en" }
                          - { label: "Publish date", name: "date", widget: "datetime" }
                          - { label: "Author", name: "author", widget: "string", required: false }
                          - { label: "Cover image", name: "cover_image", widget: "image", required: false }
                          - { label: "Excerpt", name: "excerpt", widget: "text", required: false }
                          - { label: "Tags", name: "tags", widget: "list", required: false }
                          - { label: "Published", name: "published", widget: "boolean", default: true }
                          - { label: "Body", name: "body", widget: "markdown" }
